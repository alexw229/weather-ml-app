name: CI Pipeline
on:
  push:
    branches: [ main ]
jobs:
  build-test-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m venv flaskappenv
          source flaskappenv/bin/activate
          pip install Flask
          pip install -r requirements.txt
